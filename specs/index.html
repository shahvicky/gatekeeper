 code interception, CSRF, token leakage, clickjacking and phishing, with countermeasures for each.",open:"It aged fast. Mobile apps, SPAs and new research outgrew it, and RFC 9700 replaced much of its guidance in 2025.",next:["rfc9700"],terms:["threat model","countermeasure"]},{id:"rfc7009",code:"RFC 7009",name:"Token Revocation",body:"IETF",cat:"Standards Track",date:"August 2013",year:2013,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc7009",problem:"When a user signs out or uninstalls an app, the client had no standard way to tell the authorization server its tokens are no longer needed.",kind:"deployment",pushed:"Providers each shipped proprietary \u201Crevoke\u201D endpoints, so clients needed per-provider code just to clean up.",cases:[],does:"A `/revoke` endpoint that accepts a token and an optional `token_type_hint`. Revoking a refresh token can revoke its access tokens too. The server answers 200 even for unknown tokens, so it can\u2019t be used to probe for valid ones.",open:"Revoking a self-contained JWT access token doesn\u2019t stop APIs that validate it locally. That gap leads to short lifetimes, introspection and shared signals.",next:["rfc7662","caep"],terms:["token_type_hint","/revoke"]},{id:"rfc7662",code:"RFC 7662",name:"Token Introspection",body:"IETF",cat:"Standards Track",date:"October 2015",year:2015,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc7662",problem:"Reference (opaque) tokens mean nothing to a resource server. It needs to ask the issuer what a token allows.",kind:"deployment",pushed:"Large providers had proprietary \u201Ctokeninfo\u201D endpoints. Resource servers integrating with several issuers wanted one way to ask.",cases:[],does:"The resource server POSTs the token to `/introspect` and authenticates itself. The answer is `active` plus optional claims such as `scope`, `sub`, `client_id` and `exp`.",open:"A round trip per check, unsigned answers, and an endpoint that must be protected against token scanning. JWT access tokens and signed introspection responses followed.",next:["rfc9068","rfc9701"],terms:["active","/introspect","token_type_hint"]},{id:"rfc9701",code:"RFC 9701",name:"JWT Response for Token Introspection",body:"IETF",cat:"Standards Track",date:"January 2025",year:2025,url:"https://www.rfc-editor.org/rfc/rfc9701",problem:"A plain JSON introspection answer can\u2019t be shown later as proof of what the authorization server said, and can\u2019t be trusted when it passes through intermediaries.",kind:"deployment",pushed:"High-assurance deployments, notably open banking and identity assurance, wanted signed (and optionally encrypted) introspection results they could log as evidence.",cases:[],does:"The resource server asks for `application/token-introspection+jwt`, and the authorization server returns a signed JWT wrapping the introspection result.",open:"Adds key management on both sides for a benefit many deployments don\u2019t need.",next:["fapi2-ms"],terms:["token-introspection+jwt"]},{id:"rfc7636",code:"RFC 7636",name:"Proof Key for Code Exchange (PKCE)",body:"IETF",cat:"Standards Track",date:"September 2015",year:2015,kc:"Supported",deep:"pkce",url:"https://www.rfc-editor.org/rfc/rfc7636",problem:"Native apps receive authorization codes through custom URL schemes that any app can claim, and they have no secret to prove they\u2019re the app that asked.",kind:"research",pushed:"Code interception by malicious apps registering the same scheme was demonstrated on mobile platforms. The spec opens with exactly that attack.",cases:["c-embedded-2016"],does:"The client sends a hash of a fresh random secret (`code_challenge`) with the authorization request and proves knowledge of the secret (`code_verifier`) when redeeming the code.",open:"The `plain` method and servers that skip the check when no verifier is sent left gaps. RFC 9700 later made PKCE the default for every client, because it also stops code injection.",next:["rfc8252","rfc9700","oauth21"],terms:["code_verifier","code_challenge","S256"]},{id:"rfc8252",code:"RFC 8252",name:"OAuth 2.0 for Native Apps",body:"IETF",cat:"Best Current Practice (BCP 212)",date:"October 2017",year:2017,deep:"pkce",url:"https://www.rfc-editor.org/rfc/rfc8252",problem:"Apps showed sign-in pages in embedded web views, where the app can read everything the user types and there is no shared browser session.",kind:"platform",pushed:"Embedded web views trained users to type passwords into apps. Google announced in 2016 that it would block OAuth requests from embedded web views.",cases:["c-embedded-2016"],does:"Requires the system browser (or in-app browser tabs), lists safe redirect options (claimed HTTPS, private-use schemes, loopback), and requires PKCE.",open:"Browser-based apps had their own, harder problem, solved much later by the browser-apps BCP.",next:["rfc10017","rfc9700"],terms:["ASWebAuthenticationSession","Universal Links","loopback redirect"]},{id:"rfc10017",code:"RFC 10017",name:"OAuth 2.0 for Browser-Based Applications",body:"IETF",cat:"Best Current Practice (BCP 212)",date:"August 2026",year:2026,url:"https://www.rfc-editor.org/rfc/rfc10017",problem:"Single-page apps run entirely in the browser, where any injected script runs as the app. The implicit flow they used put tokens in URLs.",kind:"research",pushed:"The Security BCP deprecated the implicit flow, and research showed that every in-browser token storage choice falls to malicious JavaScript, which can simply run its own flow.",cases:["c-polyfill-2024"],does:"Ranks architectures: Backend-for-Frontend first, token-mediating backend second, and a pure browser client last, unsuitable for sensitive data. Details CSRF, cookie and CSP requirements.",open:"Even with a BFF, XSS can ride the user\u2019s session while the tab is open.",next:["rfc9449"],terms:["BFF","token-mediating backend","__Host- cookie"]},{id:"rfc9700",code:"RFC 9700",name:"Best Current Practice for OAuth 2.0 Security",body:"IETF",cat:"Best Current Practice (BCP 240)",date:"January 2025",year:2025,deep:"bcp",url:"https://www.rfc-editor.org/rfc/rfc9700",problem:"RFC 6749 and its 2013 threat model predated mobile apps at scale, SPAs, open banking and a decade of attacks.",kind:"research",pushed:"Formal analysis (Fett, K\xFCsters and Schmitz, 2016) found new attacks including mix-up. Covert Redirect (2014) exposed loose redirect validation. Real deployments kept leaking tokens through the implicit flow.",cases:["c-fett-2016","c-covert-2014"],does:"Requires exact redirect URI matching and PKCE, forbids the implicit and password grants, requires sender-constrained or rotated refresh tokens for public clients, and gives mix-up defenses.",open:"It\u2019s a patch layered on 6749, so understanding OAuth still means reading several documents. OAuth 2.1 consolidates them.",next:["oauth21","rfc9207"],terms:["mix-up","exact matching","refresh token rotation"]},{id:"oauth21",code:"draft-ietf-oauth-v2-1",name:"The OAuth 2.1 Authorization Framework",body:"IETF",cat:"Internet-Draft (Standards Track)",date:"draft -17, October 2026",year:2026,kc:"Supported",deep:"bcp",url:"https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/",problem:"Secure OAuth 2.0 meant combining 6749, 6750, PKCE, the native-apps BCP, the browser-apps BCP and the Security BCP.",kind:"deployment",pushed:"Implementers kept shipping insecure defaults that were technically allowed by 6749.",cases:[],does:"One document with the safe defaults built in: PKCE for every code flow, no implicit or password grant, exact redirect matching, bearer tokens only in headers or bodies, constrained refresh tokens.",open:"Still an Internet-Draft after six years. Teach its rules as the baseline, but cite the RFCs.",next:["rfc9700"],terms:["PKCE required","no implicit"]},{id:"rfc9207",code:"RFC 9207",name:"Authorization Server Issuer Identification",body:"IETF",cat:"Standards Track",date:"March 2022",year:2022,kc:"Supported",deep:"bcp",url:"https://www.rfc-editor.org/rfc/rfc9207",problem:"A client that talks to several authorization servers can be tricked into sending a code from an honest server to a malicious one.",kind:"research",pushed:"The mix-up attack, published in 2016 formal analysis work.",cases:["c-fett-2016"],does:"The authorization server adds `iss` to every authorization response. The client compares it with the issuer it started the flow with before redeeming the code.",open:"Only works if clients check it. The 2026 MCP revision now requires clients to.",next:["mcp-auth"],terms:["iss parameter","mix-up"]},{id:"rfc8414",code:"RFC 8414",name:"Authorization Server Metadata",body:"IETF",cat:"Standards Track",date:"June 2018",year:2018,kc:"Supported",deep:"discovery",url:"https://www.rfc-editor.org/rfc/rfc8414",problem:"Clients hard-coded endpoint URLs and capabilities for each authorization server.",kind:"deployment",pushed:"OpenID Connect Discovery (2014) solved this for OIDC providers; plain OAuth servers wanted the same without OIDC.",cases:[],does:"A JSON document at `/.well-known/oauth-authorization-server` listing the issuer, endpoints, supported grants, algorithms and PKCE methods. The `issuer` value must match the URL it came from.",open:"APIs still had no way to say which authorization server protects them, which RFC 9728 later added.",next:["rfc9728","rfc9207"],terms:["issuer","jwks_uri","code_challenge_methods_supported"]},{id:"rfc7591",code:"RFC 7591 / 7592",name:"Dynamic Client Registration (and Management)",body:"IETF",cat:"Standards Track / Experimental",date:"July 2015",year:2015,kc:"Supported",deep:"discovery",url:"https://www.rfc-editor.org/rfc/rfc7591",problem:"Manual client registration doesn\u2019t work when any client should be able to talk to any server, like an email app connecting to any mail provider.",kind:"deployment",pushed:"Open ecosystems (OpenID Connect, UMA, health data) needed software to register itself at runtime.",cases:["c-ssrf-2021"],does:"A client POSTs its metadata (redirect URIs, name, logo, keys) to `/register` and receives a `client_id`. RFC 7592 adds read, update and delete of that registration.",open:"Anyone can register anything, metadata URLs can trigger server-side requests, and the server learns nothing about who the client really is. Client ID Metadata Documents answer that.",next:["cimd","openid-federation"],terms:["registration_access_token","software_statement"]},{id:"rfc7521",code:"RFC 7521",name:"Assertion Framework for Client Authentication and Authorization Grants",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc7521",problem:"Organizations already had signed assertions from their identity systems and wanted to trade them for OAuth tokens, and to authenticate clients without shared secrets.",kind:"deployment",pushed:"Enterprise SSO (SAML) and server-to-server integrations.",cases:[],does:"A generic pattern: an assertion as a grant (`grant_type` + `assertion`) or as client authentication (`client_assertion_type` + `client_assertion`).",open:"Abstract on purpose. The SAML and JWT profiles make it concrete.",next:["rfc7522","rfc7523"],terms:["client_assertion","assertion grant"]},{id:"rfc7522",code:"RFC 7522",name:"SAML 2.0 Profile for OAuth Client Authentication and Grants",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,url:"https://www.rfc-editor.org/rfc/rfc7522",problem:"Enterprises with a SAML identity provider wanted API access without re-authenticating users.",kind:"deployment",pushed:"SAML was the enterprise SSO standard when OAuth arrived.",cases:[],does:"Defines how a SAML assertion is presented as a grant or as client authentication.",open:"Carries all of SAML\u2019s XML signature complexity. The JWT profile became the common choice.",next:["rfc7523","saml2"],terms:["saml2-bearer"]},{id:"rfc7523",code:"RFC 7523",name:"JWT Profile for Client Authentication and Authorization Grants",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc7523",problem:"Client secrets are shared passwords: sent on every request, stored by both sides, and leakable from either.",kind:"deployment",pushed:"Server-side integrations wanted key-based authentication where the private key never leaves the client.",cases:[],does:"`private_key_jwt`: the client signs a short-lived JWT (`iss`, `sub`, `aud`, `exp`, `jti`) as its credential. Also defines the JWT bearer grant used later by identity chaining and ID-JAG.",open:"Its audience rules were loose enough that the working group is tightening them in an update, and replay depends on servers tracking `jti`.",next:["identity-chaining","id-jag","fapi2-sp"],terms:["private_key_jwt","jwt-bearer","jti"]},{id:"rfc8628",code:"RFC 8628",name:"Device Authorization Grant",body:"IETF",cat:"Standards Track",date:"August 2019",year:2019,kc:"Supported",deep:"device",url:"https://www.rfc-editor.org/rfc/rfc8628",problem:"TVs, consoles and command-line tools can\u2019t show a browser or take a password comfortably.",kind:"deployment",pushed:"Streaming and TV sign-in patterns (\u201Cgo to example.com/activate and enter this code\u201D) were already common but proprietary.",cases:["c-storm2372-2025"],does:"The device gets a `device_code` and a short `user_code`. The user approves on another device at `verification_uri` while the device polls the token endpoint.",open:"Nothing ties the approving user to the device in front of them, so attackers send victims their own codes. Device code phishing became a major campaign technique in 2024\u201325.",next:["ciba"],terms:["device_code","user_code","authorization_pending","slow_down"]},{id:"rfc8693",code:"RFC 8693",name:"Token Exchange",body:"IETF",cat:"Standards Track",date:"January 2020",year:2020,kc:"Supported (partial)",deep:"txn",url:"https://www.rfc-editor.org/rfc/rfc8693",problem:"A service holding a token for itself needs a different token to call the next service, with the right audience, and sometimes on behalf of the original user.",kind:"deployment",pushed:"Security token services from the WS-Trust era, and microservices forwarding tokens they shouldn\u2019t.",cases:["c-midnight-2024"],does:"A generic exchange at the token endpoint: `subject_token`, optional `actor_token`, `requested_token_type`, `audience`, `resource`. Defines the `act` and `may_act` claims for delegation chains.",open:"Semantics are left to each server. Transaction Tokens (inside a domain) and identity chaining (across domains) add structure.",next:["txn-tokens","identity-chaining","id-jag"],terms:["subject_token","actor_token","act","may_act"]},{id:"rfc8707",code:"RFC 8707",name:"Resource Indicators",body:"IETF",cat:"Standards Track",date:"February 2020",year:2020,url:"https://www.rfc-editor.org/rfc/rfc8707",problem:"The authorization server doesn\u2019t know which API a token is for, so it mints tokens that every API will accept.",kind:"deployment",pushed:"Deployments with many APIs behind one authorization server, where a token leaked by one API worked at the others.",cases:["c-storm0558-2023"],does:"The client names the target API with a `resource` parameter in the authorization and token requests, and the server restricts the token\u2019s audience to it.",open:"Optional for years. The MCP authorization spec made it mandatory in 2025.",next:["rfc9728","mcp-auth"],terms:["resource","aud"]},{id:"rfc9068",code:"RFC 9068",name:"JWT Profile for OAuth 2.0 Access Tokens",body:"IETF",cat:"Standards Track",date:"October 2021",year:2021,url:"https://www.rfc-editor.org/rfc/rfc9068",problem:"Every vendor shaped its JWT access tokens differently, so APIs couldn\u2019t validate them interoperably, and ID tokens were sometimes accepted as access tokens.",kind:"deployment",pushed:"JWT access tokens had become the norm without a standard.",cases:["c-noauth-2023"],does:"Requires `typ: at+jwt` and the claims `iss`, `exp`, `aud`, `sub`, `client_id`, `iat`, `jti`, with validation rules. For client-credentials tokens, `sub` identifies the client.",open:"Self-contained tokens still can\u2019t be revoked before they expire.",next:["rfc7662","caep"],terms:["at+jwt","client_id","aud"]},{id:"rfc9728",code:"RFC 9728",name:"OAuth 2.0 Protected Resource Metadata",body:"IETF",cat:"Standards Track",date:"April 2025",year:2025,deep:"mcp",url:"https://www.rfc-editor.org/rfc/rfc9728",problem:"A client given only an API URL can\u2019t tell which authorization server protects it, which scopes exist, or whether it requires DPoP.",kind:"deployment",pushed:"Dynamic ecosystems where clients meet new APIs at runtime, above all AI agents connecting to MCP servers.",cases:[],does:"A JSON document at `/.well-known/oauth-protected-resource` (`resource`, `authorization_servers`, `scopes_supported`, \u2026), and a `resource_metadata` parameter on 401 challenges that points to it.",open:"The client now trusts what the API claims about its authorization servers, so validation of every hop still matters.",next:["mcp-auth"],terms:["resource_metadata","authorization_servers"]},{id:"rfc7515",code:"RFC 7515",name:"JSON Web Signature (JWS)",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",deep:"jose",url:"https://www.rfc-editor.org/rfc/rfc7515",problem:"Signing XML for SAML required canonicalization and was notoriously easy to get wrong. The web needed a compact, URL-safe way to sign JSON.",kind:"research",pushed:"XML signature wrapping attacks broke most SAML frameworks studied in 2012.",cases:["c-xsw-2012"],does:"Signs the exact bytes: `BASE64URL(header).BASE64URL(payload).BASE64URL(signature)`. No canonicalization.",open:"The header names its own algorithm, an agility feature that became the source of `alg: none` and algorithm-confusion attacks.",next:["rfc8725"],terms:["protected header","compact serialization","alg"]},{id:"rfc7516",code:"RFC 7516",name:"JSON Web Encryption (JWE)",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",deep:"jose",url:"https://www.rfc-editor.org/rfc/rfc7516",problem:"Tokens carrying personal data pass through browsers, logs and intermediaries that shouldn\u2019t read them.",kind:"deployment",pushed:"ID tokens and request objects in the front channel.",cases:["c-invalidcurve-2017"],does:"Five-part compact form: header, encrypted key, IV, ciphertext, tag. Key management by RSA-OAEP, ECDH-ES or direct keys.",open:"Many options, some fragile: implementations of ECDH-ES that skipped point validation leaked private keys.",next:["rfc8725"],terms:["enc","ECDH-ES","RSA-OAEP"]},{id:"rfc7517",code:"RFC 7517",name:"JSON Web Key (JWK)",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",deep:"jose",url:"https://www.rfc-editor.org/rfc/rfc7517",problem:"Verifiers need the signer\u2019s public keys in a web-friendly format, with identifiers that survive key rotation.",kind:"deployment",pushed:"Publishing X.509 certificates for every relying party was heavy and slow to rotate.",cases:[],does:"Keys as JSON (`kty`, `n`, `e`, `crv`, `x`, `y`), key sets at `jwks_uri`, and `kid` to pick one.",open:"Token headers like `jwk`, `jku` and `x5u` let a token point at its own key, which verifiers must never trust.",next:["rfc7638","rfc8725"],terms:["kid","jwks_uri","kty"]},{id:"rfc7518",code:"RFC 7518",name:"JSON Web Algorithms (JWA)",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc7518",problem:"JWS and JWE needed a registry of algorithm names and how to use each one.",kind:"deployment",pushed:"Algorithm agility, so deployments could move to new algorithms without new formats.",cases:["c-jwtlibs-2015"],does:"Defines `HS256`, `RS256`, `ES256`, `PS256`, RSA-OAEP, AES-GCM and others, plus `none` for unsecured JWS.",open:"Registering `none` and RSA1_5 put dangerous options a header away. RFC 8725 tells verifiers to allowlist.",next:["rfc8725","rfc8037"],terms:["RS256","ES256","none"]},{id:"rfc7519",code:"RFC 7519",name:"JSON Web Token (JWT)",body:"IETF",cat:"Standards Track",date:"May 2015",year:2015,kc:"Supported",deep:"jose",url:"https://www.rfc-editor.org/rfc/rfc7519",problem:"SAML assertions were too heavy for mobile apps, URLs and HTTP headers.",kind:"deployment",pushed:"Simple Web Tokens and proprietary formats preceded it. OpenID Connect needed a standard claims container.",cases:["c-jwtlibs-2015"],does:"A JSON claims set (`iss`, `sub`, `aud`, `exp`, `nbf`, `iat`, `jti`) carried in a JWS or JWE.",open:"One format for many token types made it easy to accept the wrong kind of token in the wrong place.",next:["rfc8725","rfc9068"],terms:["iss","aud","exp","jti"]},{id:"rfc7638",code:"RFC 7638",name:"JWK Thumbprint",body:"IETF",cat:"Standards Track",date:"September 2015",year:2015,url:"https://www.rfc-editor.org/rfc/rfc7638",problem:"Systems needed a stable fingerprint for a key, regardless of how its JSON was formatted.",kind:"deployment",pushed:"Key identifiers and proof-of-possession bindings.",cases:[],does:"Hash a canonical JSON of only the required members, in lexicographic order, with no whitespace. DPoP\u2019s `jkt` is this thumbprint.",open:"Nothing much; it\u2019s a building block.",next:["rfc9449"],terms:["jkt","thumbprint"]},{id:"rfc7800",code:"RFC 7800",name:"Proof-of-Possession Key Semantics for JWTs",body:"IETF",cat:"Standards Track",date:"April 2016",year:2016,url:"https://www.rfc-editor.org/rfc/rfc7800",problem:"A token needed a way to say \u201Conly the holder of this key may use me\u201D.",kind:"deployment",pushed:"Bearer token theft.",cases:[],does:"Defines the `cnf` (confirmation) claim, holding a key, an encrypted key or a key id. mTLS adds `x5t#S256`, DPoP adds `jkt`, and WIMSE uses `cnf.jwk`.",open:"It only expresses the binding. Enforcing it is up to each protocol and each API.",next:["rfc8705","rfc9449","wimse-wit"],terms:["cnf"]},{id:"rfc8037",code:"RFC 8037",name:"EdDSA and X25519 in JOSE",body:"IETF",cat:"Standards Track",date:"January 2017",year:2017,kc:"Supported",url:"https://www.rfc-editor.org/rfc/rfc8037",problem:"ECDSA needs a perfect random nonce per signature; a repeated or biased nonce reveals the private key.",kind:"incident",pushed:"Real ECDSA failures, most famously the PlayStation 3 signing key extracted in 2010 because the same nonce was reused.",cases:["c-ps3-2010"],does:"Adds the `OKP` key type with Ed25519 signatures (deterministic, no nonce to get wrong) and X25519 key agreement.",open:"Library support lagged for years, especially in browsers.",next:[],terms:["OKP","EdDSA","Ed25519"]},{id:"rfc8725",code:"RFC 8725",name:"JSON Web Token Best Current Practices",body:"IETF",cat:"Best Current Practice (BCP 225)",date:"February 2020",year:2020,deep:"jose",url:"https://www.rfc-editor.org/rfc/rfc8725",problem:"JWT libraries and applications kept accepting tokens they should have rejected.",kind:"research",pushed:"The 2015 disclosures of `alg: none` and RSA-to-HMAC confusion across popular libraries, and invalid-curve attacks on JWE in 2017.",cases:["c-jwtlibs-2015","c-invalidcurve-2017"],does:"Verify algorithms against an allowlist, validate every cryptographic input, use explicit typing (`typ`), check `iss` and `aud`, and keep different token kinds apart.",open:"New attack classes appeared (format confusion, psychic signatures). An update, RFC 8725bis, was approved in 2026.",next:["rfc9068"],terms:["explicit typing","algorithm allowlist"]},{id:"rfc8417",code:"RFC 8417",name:"Security Event Token (SET)",body:"IETF",cat:"Standards Track",date:"July 2018",year:2018,deep:"signals",url:"https://www.rfc-editor.org/rfc/rfc8417",problem:"Systems needed to send each other signed statements that something happened (a logout, a compromised account) without those statements being usable as access tokens.",kind:"deployment",pushed:"OpenID back-channel logout and account-security event sharing both needed an event format.",cases:[],does:"A JWT with an `events` claim keyed by event-type URI. Delivery is defined separately (push in RFC 8935, poll in RFC 8936).",open:"Only a format. The Shared Signals Framework adds streams, subjects and management.",next:["ssf","oidc-backchannel"],terms:["events","secevent+jwt"]},{id:"rfc9901",code:"RFC 9901",name:"Selective Disclosure for JWTs (SD-JWT)",body:"IETF",cat:"Standards Track",date:"November 2025",year:2025,url:"https://www.rfc-editor.org/rfc/rfc9901",problem:"A signed JWT reveals every claim to everyone it\u2019s shown to. A digital ID shouldn\u2019t reveal your address to prove your age.",kind:"regulation",pushed:"Digital identity wallets, above all the EU Digital Identity Wallet under eIDAS 2.0, require selective disclosure.",cases:[],does:"The issuer signs salted hashes of claims. The holder reveals only the chosen disclosures, optionally with a key-binding JWT proving possession.",open:"The same credential shown twice is linkable. Unlinkability needs batches of credentials.",next:["sd-jwt-vc","oid4vci"],terms:["disclosure","_sd","key binding JWT"]}];var Ps=[{id:"oidc-core",code:"OpenID Connect Core 1.0",name:"OpenID Connect Core",body:"OpenID Foundation",cat:"Final",date:"February 2014 (errata 2023)",year:2014,kc:"Supported, certified",deep:"oidc",url:"https://openid.net/specs/openid-connect-core-1_0.html",problem:"OAuth hands a client an access token, which says nothing about who the user is or whether they just signed in. Apps used it for login anyway.",kind:"research",pushed:"\u201CLogin with OAuth\u201D led to token substitution: tokens issued to one app accepted as proof of login by another, found widely in mobile apps. OpenID 2.0 was redirect-heavy and unfit for mobile and APIs.",cases:["c-mobile-2014"],does:"Adds the ID token (a signed JWT addressed to the client, with `nonce`, `auth_time`, `acr`), the UserInfo endpoint, standard claims, and the `openid` scope.",open:"Discovery, registration, sessions and logout were left to companion specs, and many apps still identify users by email instead of `iss` + `sub`.",next:["oidc-discovery","oidc-session","oidc-backchannel"],terms:["id_token","nonce","at_hash","acr","sub"]},{id:"oidc-discovery",code:"OpenID Connect Discovery 1.0",name:"OpenID Connect Discovery",body:"OpenID Foundation",cat:"Final",date:"February 2014",year:2014,kc:"Supported, certified",deep:"discovery",url:"https://openid.net/specs/openid-connect-discovery-1_0.html",problem:"A relying party needs a provider\u2019s endpoints, keys and supported features, and shouldn\u2019t hard-code them.",kind:"deployment",pushed:"Providers changed endpoints and rotated keys; relying parties broke.",cases:[],does:"Publishes `/.well-known/openid-configuration`, and optionally WebFinger to find which provider serves a user. The `issuer` in the document must exactly equal the URL\u2019s issuer.",open:"A client that fetches discovery from an attacker-chosen issuer trusts whatever it says. Mix-up defenses came later.",next:["rfc8414","rfc9207"],terms:["openid-configuration","issuer","jwks_uri"]},{id:"oidc-registration",code:"OpenID Connect Dynamic Client Registration 1.0",name:"OpenID Connect Dynamic Registration",body:"OpenID Foundation",cat:"Final",date:"February 2014",year:2014,kc:"Supported, certified",deep:"discovery",url:"https://openid.net/specs/openid-connect-registration-1_0.html",problem:"Open ecosystems can\u2019t pre-register every relying party with every provider.",kind:"deployment",pushed:"The original OpenID vision of any site trusting any provider.",cases:["c-ssrf-2021"],does:"Clients register their metadata (`redirect_uris`, `jwks_uri`, `logo_uri`, `sector_identifier_uri`, \u2026) at runtime.",open:"Many metadata fields are URLs the provider fetches, which researchers turned into server-side request forgery in 2021.",next:["rfc7591","cimd","openid-federation"],terms:["sector_identifier_uri","request_uris"]},{id:"oidc-session",code:"OpenID Connect Session Management 1.0",name:"Session Management",body:"OpenID Foundation",cat:"Final",date:"September 2022",year:2022,kc:"Supported, certified",deep:"logout",url:"https://openid.net/specs/openid-connect-session-1_0.html",problem:"A relying party needs to know when the user\u2019s session at the provider ends.",kind:"deployment",pushed:"Single sign-out expectations from enterprise SSO.",cases:["c-itp-2020"],does:"The relying party embeds the provider\u2019s `check_session_iframe` and polls it with `postMessage`, comparing a `session_state` value.",open:"It depends on the provider reading its own cookie inside a third-party iframe, which browsers that block third-party cookies break.",next:["oidc-backchannel"],terms:["check_session_iframe","session_state"]},{id:"oidc-rpinitiated",code:"OpenID Connect RP-Initiated Logout 1.0",name:"RP-Initiated Logout",body:"OpenID Foundation",cat:"Final",date:"September 2022",year:2022,kc:"Supported, certified",deep:"logout",url:"https://openid.net/specs/openid-connect-rpinitiated-1_0.html",problem:"Signing out of an app left the provider session alive, so the next login was silent.",kind:"deployment",pushed:"Shared computers and kiosks.",cases:[],does:"The relying party redirects to `end_session_endpoint` with `id_token_hint` and a registered `post_logout_redirect_uri`.",open:"Other apps sharing the session aren\u2019t told; that takes front- or back-channel logout. An unregistered post-logout URI is an open redirect.",next:["oidc-backchannel","oidc-frontchannel"],terms:["end_session_endpoint","post_logout_redirect_uri"]},{id:"oidc-frontchannel",code:"OpenID Connect Front-Channel Logout 1.0",name:"Front-Channel Logout",body:"OpenID Foundation",cat:"Final",date:"September 2022",year:2022,kc:"Supported, certified",deep:"logout",url:"https://openid.net/specs/openid-connect-frontchannel-1_0.html",problem:"When the user logs out at the provider, every relying party should end its session too.",kind:"deployment",pushed:"Single logout across many apps.",cases:["c-itp-2020"],does:"The provider\u2019s logout page loads each relying party\u2019s `frontchannel_logout_uri` in an iframe, with `iss` and `sid`.",open:"Iframes need the relying party\u2019s cookies, which third-party cookie blocking withholds. Failures are silent.",next:["oidc-backchannel"],terms:["frontchannel_logout_uri","sid"]},{id:"oidc-backchannel",code:"OpenID Connect Back-Channel Logout 1.0",name:"Back-Channel Logout",body:"OpenID Foundation",cat:"Final",date:"September 2022",year:2022,kc:"Supported, certified",deep:"logout",url:"https://openid.net/specs/openid-connect-backchannel-1_0.html",problem:"Browser-based logout is unreliable: tabs close, iframes are blocked, cookies are withheld.",kind:"platform",pushed:"Third-party cookie blocking and the fragility of front-channel logout.",cases:["c-itp-2020"],does:"The provider POSTs a signed logout token (a SET with the back-channel logout event, `sid` and/or `sub`, and no `nonce`) directly to each relying party\u2019s server.",open:"Relying parties must index sessions by `sid` and be reachable from the provider. Broader session signals came with CAEP.",next:["caep"],terms:["logout_token","backchannel_logout_uri","sid"]},{id:"ciba",code:"OpenID Connect CIBA Core 1.0",name:"Client-Initiated Backchannel Authentication",body:"OpenID Foundation",cat:"Final",date:"September 2021",year:2021,kc:"Supported, certified",deep:"ciba",url:"https://openid.net/specs/openid-client-initiated-backchannel-authentication-core-1_0.html",problem:"Sometimes the device asking for authentication isn\u2019t the one the user holds: a call centre, a shop till, a bank teller, a smart speaker.",kind:"deployment",pushed:"Banks wanted decoupled approval on the customer\u2019s phone, which FAPI-CIBA later profiled for open banking.",cases:["c-uber-2022"],does:"The client calls `/bc-authorize` with a hint about the user and a `binding_message`. The provider asks the user on their own device, and the client gets tokens by poll, ping or push.",open:"Push approvals invite fatigue and phishing: an attacker can start a request and hope the user taps Approve.",next:["fapi-ciba","rfc ew users straight to sign-up had no standard way to ask the provider for it.",kind:"deployment",pushed:"Every provider had a proprietary parameter.",cases:[],does:"Adds `prompt=create` to the authorization request.",open:"Small and self-contained.",next:[],terms:["prompt=create"]},{id:"oidc-native-sso",code:"OpenID Connect Native SSO for Mobile Apps",name:"Native SSO",body:"OpenID Foundation",cat:"Draft",date:"in progress",year:2022,url:"https://openid.net/specs/openid-connect-native-sso-1_0.html",problem:"Several apps from the same vendor on one device each made the user sign in again.",kind:"deployment",pushed:"Shared browser cookies became less reliable on mobile.",cases:[],does:"Issues a `device_secret` shared among the vendor\u2019s apps, which another app exchanges with the ID token for its own tokens via token exchange.",open:"The device secret is a powerful bearer artifact on the device.",next:["rfc8693"],terms:["device_secret","device_sso"]},{id:"oidc-ida",code:"OpenID Connect for Identity Assurance 1.0",name:"Identity Assurance (eKYC)",body:"OpenID Foundation",cat:"Final",date:"Final specification",year:2024,url:"https://openid.net/specs/openid-connect-4-identity-assurance-1_0.html",problem:"Regulated services need verified identity data (how it was checked, against which document), not just claims a user typed.",kind:"regulation",pushed:"Know-your-customer and anti-money-laundering rules, and reuse of bank-verified identities.",cases:[],does:"Adds `verified_claims` with the trust framework, verification process and evidence alongside the claims.",open:"Trust frameworks differ by country; relying parties must understand each.",next:["oid4vci"],terms:["verified_claims","trust_framework"]},{id:"openid-federation",code:"OpenID Federation 1.0",name:"OpenID Federation",body:"OpenID Foundation",cat:"Final",date:"February 2026",year:2026,url:"https://openid.net/specs/openid-federation-1_0.html",problem:"In federations of thousands of providers and services, bilateral registration and manually curated metadata don\u2019t scale.",kind:"deployment",pushed:"Research-and-education SAML federations and national identity systems needed the same multilateral trust for OpenID Connect.",cases:["c-goldensaml-2020"],does:"Entities publish signed entity statements; trust anchors and intermediates sign statements about them; a relying party resolves a trust chain and applies metadata policy. Trust marks certify properties.",open:"Powerful but complex, and implementations are young.",next:[],terms:["entity statement","trust chain","trust anchor","trust mark"]},{id:"siopv2",code:"Self-Issued OpenID Provider v2",name:"Self-Issued OP (SIOPv2)",body:"OpenID Foundation",cat:"Draft",date:"in progress",year:2023,url:"https://openid.net/specs/openid-connect-self-issued-v2-1_0.html",problem:"Logging in through a central provider lets it see every site you visit and makes you depend on it.",kind:"deployment",pushed:"Wallet-based identity.",cases:[],does:"The user\u2019s wallet acts as its own OpenID provider, signing ID tokens with a key the user controls.",open:"The relying party learns only \u201Cthe same key as last time\u201D; real attributes come from verifiable credentials.",next:["oid4vp"],terms:["self-issued","subject syntax type"]},{id:"saml2",code:"SAML 2.0",name:"Security Assertion Markup Language 2.0",body:"OASIS",cat:"OASIS Standard",date:"March 2005",year:2005,kc:"Supported (broad)",deep:"saml",url:"https://www.oasis-open.org/standard/saml/",problem:"Enterprises needed employees to sign in once and reach partner and SaaS apps in other domains.",kind:"deployment",pushed:"SAML 1.x, Liberty Alliance and Shibboleth converged into one standard.",cases:["c-xsw-2012","c-duo-2018","c-goldensaml-2020"],does:"An identity provider issues signed XML assertions about a subject, delivered by browser redirect or POST to a service provider.",open:"XML signatures are fragile (wrapping, comment truncation), and stolen token-signing keys let attackers forge any assertion. It also has no story for APIs or mobile apps.",next:["oidc-core","rfc7522"],terms:["Assertion","NameID","AudienceRestriction","InResponseTo"]}];var Cs=[{id:"rfc8705",code:"RFC 8705",name:"Mutual-TLS Client Authentication and Certificate-Bound Tokens",body:"IETF",cat:"Standards Track",date:"February 2020",year:2020,kc:"Supported",deep:"sender",url:"https://www.rfc-editor.org/rfc/rfc8705",problem:"Bearer tokens work for anyone who steals them, and client secrets are shared passwords.",kind:"regulation",pushed:"Open banking needed strong client authentication and stolen-token resistance for server-to-server calls.",cases:["c-openbanking-2018"],does:"Clients authenticate with a TLS client certificate (PKI or self-signed), and access tokens carry `cnf.x5t#S256`, the certificate\u2019s hash, so APIs accept them only over a TLS connection using that certificate.",open:"Breaks wherever TLS terminates at a proxy, and browsers can\u2019t use it. DPoP covers those clients.",next:["rfc9449","fapi2-sp"],terms:["tls_client_auth","x5t#S256","mtls_endpoint_aliases"]},{id:"rfc9449",code:"RFC 9449",name:"Demonstrating Proof of Possession (DPoP)",body:"IETF",cat:"Standards Track",date:"September 2023",year:2023,kc:"Supported",deep:"sender",url:"https://www.rfc-editor.org/rfc/rfc9449",problem:"Browser and mobile clients needed sender-constrained tokens without client certificates.",kind:"platform",pushed:"Token Binding, the TLS-layer approach, died when Chrome dropped it in 2018, leaving no browser-friendly binding.",cases:["c-tokenbinding-2018"],does:"The client signs a fresh proof JWT (`htm`, `htu`, `iat`, `jti`, and `ath` with a token) for every request with its own key. Tokens carry `cnf.jkt`, the key\u2019s thumbprint. Servers can demand a `nonce`.",open:"Malicious JavaScript can\u2019t export a non-extractable key, but it can ask the browser to sign proofs while it runs.",next:["fapi2-sp","rfc10017"],terms:["DPoP proof","jkt","ath","DPoP-Nonce"]},{id:"rfc9126",code:"RFC 9126",name:"Pushed Authorization Requests (PAR)",body:"IETF",cat:"Standards Track",date:"September 2021",year:2021,kc:"Supported",deep:"par",url:"https://www.rfc-editor.org/rfc/rfc9126",problem:"Authorization request parameters travel through the browser, where they can be read, changed and logged, and rich requests outgrow URL limits.",kind:"regulation",pushed:"Open banking requests carry payment details that must not be tampered with or exposed.",cases:[],does:"The client POSTs the request to `/par` over the back channel (authenticated) and gets a short-lived `request_uri`. The browser only carries `client_id` and `request_uri`.",open:"The authorization response still comes back through the browser.",next:["rfc9101","jarm","fapi2-sp"],terms:["request_uri","/par"]},{id:"rfc9101",code:"RFC 9101",name:"JWT-Secured Authorization Request (JAR)",body:"IETF",cat:"Standards Track",date:"August 2021",year:2021,kc:"Supported",deep:"par",url:"https://www.rfc-editor.org/rfc/rfc9101",problem:"Authorization parameters had no integrity or source authentication; anyone in the middle could alter them.",kind:"deployment",pushed:"OpenID Connect\u2019s request objects (2014) were adopted for high-security profiles and standardized for OAuth.",cases:[],does:"All parameters go into a signed (and optionally encrypted) request object JWT, passed by value (`request`) or by reference (`request_uri`).",open:"Fetching `request_uri` from arbitrary URLs is a server-side request forgery risk, and signing alone doesn\u2019t keep data out of the front channel. PAR is usually simpler.",next:["rfc9126"],terms:["request object","oauth-authz-req+jwt"]},{id:"jarm",code:"FAPI JARM",name:"JWT Secured Authorization Response Mode",body:"OpenID Foundation",cat:"Final",date:"November 2022",year:2022,kc:"Supported, certified",deep:"par",url:"https://openid.net/specs/oauth-v2-jarm.html",problem:"Authorization responses could be injected or swapped, and the client couldn\u2019t tell which server produced them.",kind:"research",pushed:"Mix-up and code injection research, and FAPI 1.0 Advanced\u2019s need for a signed response without using hybrid flow.",cases:["c-fett-2016"],does:"`response_mode=jwt`: the code, state and `iss` come back inside a JWT signed by the authorization server and addressed to the client.",open:"FAPI 2.0 reached the same goals with PAR, PKCE and the `iss` parameter; JARM moved to the optional Message Signing profile.",next:["rfc9207","fapi2-ms"],terms:["response_mode=jwt"]},{id:"rfc9396",code:"RFC 9396",name:"Rich Authorization Requests (RAR)",body:"IETF",cat:"Standards Track",date:"May 2023",year:2023,deep:"rar",url:"https://www.rfc-editor.org/rfc/rfc9396",problem:"A scope string can say \u201Cpayments\u201D but not \u201Cpay \u20AC123.50 to this account, once\u201D.",kind:"regulation",pushed:"PSD2\u2019s strong customer authentication rules require dynamic linking: the authentication must be bound to the exact amount and payee.",cases:["c-psd2-2019"],does:"An `authorization_details` JSON array of typed objects (amount, creditor, actions, locations) in the request, shown at consent and echoed in tokens and introspection.",open:"Each ecosystem defines its own types, and long-lived grants need lifecycle management.",next:["grant-management","rfc9126"],terms:["authorization_details","type"]},{id:"grant-management",code:"FAPI Grant Management",name:"Grant Management for OAuth 2.0",body:"OpenID Foundation",cat:"Implementer\u2019s Draft",date:"in progress",year:2021,deep:"rar",url:"https://openid.net/specs/fapi-grant-management.html",problem:"Long-lived consents (read my accounts for 90 days) need to be queried, extended, narrowed and revoked as one object.",kind:"regulation",pushed:"Open banking consent lifecycles.",cases:[],does:"A `grant_id` returned with tokens, `grant_management_action` (create, merge, replace) on new requests, and a grant management API.",open:"Still a draft; ecosystems often use their own consent APIs.",next:[],terms:["grant_id","grant_management_action"]},{id:"fapi1",code:"FAPI 1.0 Part 1 and Part 2",name:"Financial-grade API Security Profile 1.0 (Baseline and Advanced)",body:"OpenID Foundation",cat:"Final",date:"March 2021",year:2021,kc:"Supported, certified",deep:"fapi2",url:"https://openid.net/specs/openid-financial-api-part-2-1_0.html",problem:"OAuth 2.0 leaves most security decisions optional, which is fine for photo sharing and not for bank accounts.",kind:"regulation",pushed:"UK Open Banking (2018) required banks to open APIs to third parties securely.",cases:["c-openbanking-2018","c-fapianalysis-2019"],does:"A profile: confidential clients, mTLS or private_key_jwt, sender-constrained tokens, request objects, and hybrid flow or JARM for signed responses.",open:"Formal analysis found attacks, and the profile was hard to implement consistently. FAPI 2.0 was redesigned around an explicit attacker model.",next:["fapi2-sp"],terms:["Baseline","Advanced"]},{id:"fapi-ciba",code:"FAPI CIBA Profile",name:"FAPI Client Initiated Backchannel Authentication Profile",body:"OpenID Foundation",cat:"Draft",date:"in progress",year:2019,kc:"Supported, certified",deep:"ciba",url:"https://openid.net/specs/openid-financial-api-ciba.html",problem:"Decoupled approvals for payments need financial-grade protections.",kind:"regulation",pushed:"Banks using CIBA for in-branch and call-centre payments.",cases:[],does:"Applies FAPI rules (signed requests, sender-constrained tokens, confidential clients) to CIBA.",open:"Still a draft.",next:["ciba"],terms:["signed authentication request"]},{id:"fapi2-sp",code:"FAPI 2.0 Security Profile",name:"FAPI 2.0 Security Profile and Attacker Model",body:"OpenID Foundation",cat:"Final",date:"February 2025",year:2025,kc:"Supported (passed, not certified)",deep:"fapi2",url:"https://openid.net/specs/fapi-security-profile-2_0-final.html",problem:"FAPI 1.0 was a long list of rules without a stated threat model, so nobody could say what it protected against.",kind:"research",pushed:"Formal security analysis of FAPI 1.0 (2019) found attacks the authors had not anticipated, and recommended stating the attacker model first.",cases:["c-fapianalysis-2019"],does:"A formally analysed profile: PAR, PKCE, confidential clients with mTLS or private_key_jwt, sender-constrained tokens (mTLS or DPoP), `iss` in responses, short-lived codes, no implicit or hybrid flows.",open:"Non-repudiation is a separate profile (Message Signing).",next:["fapi2-ms"],terms:["attacker model","PAR","sender-constrained"]},{id:"fapi2-ms",code:"FAPI 2.0 Message Signing",name:"FAPI 2.0 Message Signing",body:"OpenID Foundation",cat:"Final",date:"2025",year:2025,kc:"Supported (passed, not certified)",deep:"fapi2",url:"https://openid.net/specs/fapi-message-signing-2_0-final.html",problem:"Some regulators and disputes need proof of what was requested and answered, not just a secure channel.",kind:"regulation",pushed:"Non-repudiation requirements in open banking ecosystems.",cases:[],does:"Signed request objects (JAR), signed responses (JARM), signed introspection responses, and HTTP message signatures (RFC 9421) on resource requests and responses.",open:"More keys and more validation; only some ecosystems need it.",next:["rfc9421"],terms:["non-repudiation"]},{id:"rfc9470",code:"RFC 9470",name:"OAuth 2.0 Step-Up Authentication Challenge",body:"IETF",cat:"Standards Track",date:"September 2023",year:2023,deep:"signals",url:"https://www.rfc-editor.org/rfc/rfc9470",problem:"An API sometimes needs a stronger or more recent sign-in than the one behind the token it received, and had no standard way to say so.",kind:"deployment",pushed:"Sensitive operations (payments, admin changes) behind tokens minted from an old, weak login.",cases:["c-okta-2023"],does:'The API answers 401 with `error="insufficient_user_authentication"` and `acr_values` and/or `max_age`. The client re-runs the flow with those, and the new token carries `acr` and `auth_time`.',open:"Only helps when the API asks. Stolen session cookies still look like fresh logins.",next:["caep"],terms:["insufficient_user_authentication","acr_values","max_age"]},{id:"ssf",code:"OpenID Shared Signals Framework 1.0",name:"Shared Signals Framework (SSF)",body:"OpenID Foundation",cat:"Final",date:"September 2025",year:2025,deep:"signals",url:"https://openid.net/specs/openid-sharedsignals-framework-1_0-final.html",problem:"A session or token, once issued, keeps working even after the identity provider learns the user was compromised or fired.",kind:"incident",pushed:"Session and token theft after login (2023 support-system and CI breaches), and the gap between \u201Cissued\u201D and \u201Cstill valid\u201D.",cases:["c-okta-2023","c-circleci-2023"],does:"Transmitters and receivers set up streams and exchange Security Event Tokens about subjects, by push or poll, with verification and stream management.",open:"Only as fast as receivers act on events.",next:["caep","risc"],terms:["transmitter","receiver","stream","subject identifier"]},{id:"caep",code:"OpenID CAEP 1.0",name:"Continuous Access Evaluation Profile",body:"OpenID Foundation",cat:"Final",date:"September 2025",year:2025,deep:"signals",url:"https://openid.net/specs/openid-caep-1_0-final.html",problem:"Access decisions were made once, at login, and never revisited.",kind:"incident",pushed:"Proposed by Google in 2019; given urgency by session-hijack incidents.",cases:["c-okta-2023"],does:"Session-level events: `session-revoked`, `credential-change`, `assurance-level-change`, `device-compliance-change`, `token-claims-change`.",open:"Needs every app to subscribe and react.",next:[],terms:["session-revoked","device-compliance-change"]},{id:"risc",code:"OpenID RISC 1.0",name:"Risk Incident Sharing and Coordination",body:"OpenID Foundation",cat:"Final",date:"September 2025",year:2025,deep:"signals",url:"https://openid.net/specs/openid-risc-1_0-final.html",problem:"When one provider detects an account takeover, other services where the same person signs in keep trusting the attacker.",kind:"deployment",pushed:"Cross-account protection programs (Google\u2019s is built on RISC).",cases:[],does:"Account-level events: `account-credential-change-required`, `account-disabled`, `account-purged`, `credential-compromise`, `identifier-changed`.",open:"Sharing requires trust and privacy agreements between companies.",next:[],terms:["account-disabled","credential-compromise"]},{id:"rfc9421",code:"RFC 9421",name:"HTTP Message Signatures",body:"IETF",cat:"Standards Track",date:"February 2024",year:2024,url:"https://www.rfc-editor.org/rfc/rfc9421",problem:"TLS protects a hop, not a message. Once a proxy terminates TLS, the next service can\u2019t verify who sent a request or that it wasn\u2019t altered.",kind:"deployment",pushed:"An earlier individual draft (\u201CCavage\u201D signatures) was widely deployed in incompatible variants.",cases:[],does:"Signs selected components (method, path, chosen headers, `Content-Digest`) and carries `Signature-Input` and `Signature` headers.",open:"Choosing which components to cover is a security decision each profile must make.",next:["wimse-s2s","fapi2-ms"],terms:["Signature-Input","covered components"]},{id:"rfc9530",code:"RFC 9530",name:"Digest Fields",body:"IETF",cat:"Standards Track",date:"February 2024",year:2024,url:"https://www.rfc-editor.org/rfc/rfc9530",problem:"Message signatures cover headers, so the body needs a header that commits to it.",kind:"deployment",pushed:"The old `Digest` header was ambiguous about what it hashed.",cases:[],does:"Defines `Content-Digest` (hash of the content) and `Repr-Digest`, with algorithm negotiation.",open:"A building block.",next:["rfc9421"],terms:["Content-Digest"]}];var Rs=[{id:"spiffe",code:"SPIFFE",name:"Secure Production Identity Framework for Everyone",body:"CNCF",cat:"Graduated project (2022)",date:"since 2017",year:2017,deep:"spiffe",url:"https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE.md",problem:"Services proved who they st be created, changed and removed. Orphaned accounts of former staff are a standing risk.",kind:"deployment",pushed:"SaaS sprawl; SCIM began in 2011 as Simple Cloud Identity Management.",cases:[],does:"A schema for Users and Groups and a REST protocol (create, filter, PATCH, bulk) for provisioning.",open:"Implementations vary widely, and provisioning doesn\u2019t revoke live sessions; that\u2019s what shared signals are for.",next:["risc","caep"],terms:["/Users","/Groups","PATCH"]},{id:"uma2",code:"UMA 2.0",name:"User-Managed Access 2.0 (Grant and Federated Authorization)",body:"Kantara Initiative",cat:"Recommendation",date:"January 2018",year:2018,kc:"Supported",url:"https://docs.kantarainitiative.org/uma/wg/rec-oauth-uma-grant-2.0.html",problem:"OAuth assumes the resource owner is present to consent. Sharing your data with another person, on your terms, while you\u2019re offline, didn\u2019t fit.",kind:"deployment",pushed:"Personal health and data-sharing scenarios.",cases:[],does:"Resource servers register resources with an authorization server where the owner sets policy. A requesting party gets a permission ticket, presents claims, and receives a requesting party token.",open:"Complex; adoption stayed niche (Keycloak\u2019s authorization services implement it).",next:["authzen"],terms:["permission ticket","RPT","requesting party"]},{id:"oid4vci",code:"OpenID4VCI 1.0",name:"OpenID for Verifiable Credential Issuance",body:"OpenID Foundation",cat:"Final",date:"September 2025",year:2025,kc:"Preview",url:"https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html",problem:"Issuers (governments, banks, universities) need a standard way to put a credential into a user\u2019s wallet.",kind:"regulation",pushed:"The EU Digital Identity Wallet and mobile driving licences.",cases:[],does:"An OAuth-protected credential endpoint, credential offers, a pre-authorized code flow, and proof that the wallet holds the key the credential binds to.",open:"Trust in iss r couldn\u2019t tell the app from you, so it couldn\u2019t add a second factor or detect abuse."],broke:{title:"From OAuth 1.0 to 2.0",when:"2007\u20132012",cases:["c-password-2007","c-fixation-2009","c-roadtohell-2012"],paras:["OAuth 1.0 (December 2007) gave apps a token instead of the password. Every API request was signed with HMAC over a carefully normalized \u201Csignature base string\u201D, so tokens couldn\u2019t be replayed without the client\u2019s secret. Getting that normalization exactly right was the most common integration failure.","In April 2009 a session fixation flaw let an attacker start a flow, send the approval link to a victim, and finish it after they approved. OAuth 1.0a added a verifier code and fixed the callback at the start of the flow.","OAuth WRAP (2009) and then OAuth 2.0 (RFC 6749, October 2012) dropped request signatures for bearer tokens over TLS, and turned OAuth into a framework with many grant types. Its editor, Eran Hammer, withdrew his name months before publication, warning that the optional security would be skipped."]},design:{paras:["Four roles: the resource owner (the user), the client (the app), the authorization server (issues tokens), and the resource server (the API). Splitting the authorization server from the API means one place handles passwords, consent and MFA.","Two channels: the front channel is browser redirects, which are visible, loggable and modifiable. The back channel is direct HTTPS from client to server. The authorization code flow moves only a short-lived code through the front channel and redeems it on the back channel."],decisions:[{q:"Why a code, instead of returning the token in the redirect?",a:"Redirect URLs end up in history, logs and Referer headers. A code is single-use, expires in seconds or minutes, and is redeemed over the back channel where the client authenticates. The implicit grant skipped this and leaked tokens; it\u2019s removed in OAuth 2.1."},{q:"Why drop OAuth 1.0\u2019s request signatures?",a:"Signature normalization was the top source of bugs, and TLS was becoming universal. Bearer tokens made integration simple. The price: a stolen token works for the thief. That\u2019s the gap DPoP and mTLS fill."},{q:"Why refresh tokens?",a:"Short-lived access tokens limit damage when they leak, but sending the user back to consent every hour is unusable. Refresh tokens go only to the authorization server, so APIs never hold a long-lived credential."},{q:"Why a framework rather than one protocol?",a:"To fit consumer apps, enterprises and devices, most choices became optional. That flexibility is why secure OAuth later needed a stack of BCPs."}]},wire:async t=>{let e=t.rand(12),s="SplxlOBeZQQYbYS6WxSbIA",n=await t.jwt({typ:"at+jwt"},{iss:"https://as.example",sub:"user-8812",aud:"https://api.example",client_id:"s6BhdRkqt3",scope:"photos.read",iat:t.now(),exp:t.now()+600,jti:t.rand(8)});return[h("client","user","Send the user to the authorization server",`HTTP/1.1 302 Found

ustomer controls and can revoke centrally; per-task scoped tokens would limit what any stolen token could query."},next:{paras:["Agent authorization is where the whole catalogue meets: workload identity, OAuth delegation, token exchange, transaction context, step-up and shared signals. Most of it exists already; the work now is composing it consistently."],specs:["aiagent-auth","txn-tokens","ssf"]}}];var ge=[{id:"c-password-2007",title:"The password anti-pattern",when:"2006\u20132007",year:2007,kind:"debate",summary:"Third-party apps for Twitter, Flickr and social bookmarking sites asked users for their passwords and logged in as them. Developers from Twitter, Ma.gnolia and others started work in 2006 on a way to grant limited access without sharing passwords, and published OAuth Core 1.0 in December 2007.",lesson:"Delegation needs its own credential: limited, revocable and separate from the password.",specs:["rfc6749"]},{id:"c-fixation-2009",title:"OAuth 1.0 session fixation",when:"April 2009",year:2009,kind:"research",summary:"An attacker could start an OAuth 1.0 flow, send the authorization link to a victim, and finish the flow after the victim approved, gaining access to the victim\u2019s account. Twitter temporarily disabled OAuth. OAuth 1.0a fixed it with a verifier code and by fixing the callback URL at the start of the flow.",lesson:"A response must be bound to the party that started the request, the same idea behind PKCE and state.",specs:["rfc6749","rfc7636"]},{id:"c-roadtohell-2012",title:"\u201COAuth 2.0 and the Road to Hell\u201D",when:"July 2012",year:2012,kind:"debate",summary:"Eran Hammer, lead author and editor of OAuth 2.0, withdrew from the effort months before RFC 6749 was published. He argued that 2.0 had become an enterprise framework with too many options, weaker by default than 1.0 because it dropped signatures for bearer tokens.",lesson:"Many of his warnings, about optionality and bearer tokens, became the agenda of the next decade of OAuth specs.",specs:["rfc6749","rfc6750","rfc9700","rfc9449"]},{id:"c-xsw-2012",title:"On Breaking SAML",when:"2012",year:2012,kind:"research",summary:"Researchers at Ruhr University Bochum showed XML signature wrapping attacks against SAML: move the signed element, insert a forged one, and the library verifies one while the application reads the other. They found 11 of 14 SAML frameworks they studied vulnerable.",lesson:"Verify what you use: signature checking and data extraction must refer to the same bytes. JWS\u2019s no-canonicalization design is a reaction to this.",specs:["saml2","rfc7515"]},{id:"c-covert-2014",title:"Covert Redirect",when:"May 2014",year:2014,kind:"research",summary:"Wang Jing showed that many OAuth providers accepted any redirect URI on a client\u2019s domain. Combined with an open redirect on that domain, attackers could route codes and tokens to themselves.",lesson:"Redirect URIs must match exactly, and clients must not run open redirectors.",specs:["rfc9700","oauth21"]},{id:"c-mobile-2014",title:"OAuth Demystified for Mobile Application Developers",when:"2014",year:2014,kind:"research",summary:"Chen et al. (ACM CCS 2014) examined popular mobile apps using OAuth and OpenID Connect providers and found most implementations flawed. A common failure was accepting tokens issued to another app as proof of the user\u2019s identity.",lesson:"Authentication needs a token addressed to you: an ID token with your client_id as audience.",specs:["oidc-core"]},{id:"c-jwtlibs-2015",title:"Critical vulnerabilities in JWT libraries",when:"March 2015",year:2015,kind:"research",summary:"Tim McLean disclosed that several popular JWT libraries accepted `alg: none` tokens as valid, and that some could be tricked into verifying an RS256 token as HS256 using the public key as the HMAC secret.",lesson:"The verifier decides the algorithm, never the token.",specs:["rfc8725","rfc7518"]},{id:"c-ps3-2010",title:"PlayStation 3 ECDSA nonce reuse",when:"December 2010",year:2010,kind:"incident",summary:"Sony signed PlayStation 3 software with ECDSA but used the same nonce for every signature. Researchers recovered Sony\u2019s private signing key from two signatures.",lesson:"Algorithms with fragile randomness requirements fail in practice; deterministic signatures like Ed25519 remove the trap.",specs:["rfc8037"]},{id:"c-embedded-2016",title:"Google blocks OAuth in embedded web views",when:"August 2016",year:2016,kind:"platform",summary:"Google announced it would stop allowing OAuth sign-in from embedded web views, starting with new clients that October, because apps could read credentials typed into them and users couldn\u2019t verify the address bar.",lesson:"Sign-in belongs in the system browser, which the app can\u2019t see into.",specs:["rfc8252","rfc7636"]},{id:"c-fett-2016",title:"A Comprehensive Formal Security Analysis of OAuth 2.0",when:"2016",year:2016,kind:"research",summary:"Fett, K\xFCsters and Schmitz modelled OAuth 2.0 formally and found previously unknown attacks, including the mix-up attack (a client talking to several authorization servers sends an honest server\u2019s code to a malicious one) and state leakage through Referer headers.",lesson:"Formal models find attacks that reviews miss. Their findings fed directly into RFC 9207 and RFC 9700.",specs:["rfc9207","rfc9700","jarm"]},{id:"c-invalidcurve-2017",title:"Invalid curve attacks on JWE",when:"March 2017",year:2017,kind:"research",summary:"Antonio Sanso showed that several JOSE libraries didn\u2019t check that the sender\u2019s ephemeral public key in ECDH-ES was on the expected curve. Crafted points let an attacker recover the recipient\u2019s private key over repeated decryptions.",lesson:"Validate every cryptographic input, a rule RFC 8725 now states explicitly.",specs:["rfc8725","rfc7516"]},{id:"c-duo-2018",title:"SAML comment truncation",when:"February 2018",year:2018,kind:"research",summary:"Duo Labs found that several SAML libraries, when reading a NameID like `user@example.com<!---->.evil.com`, returned only the text before the XML comment, while the signature covered the whole value. An attacker with an account at a lookalike domain could sign in as someone else.",lesson:"Parsing differences between the signature check and the application are exploitable.",specs:["saml2"]},{id:"c-googlekeys-2018",title:"Security keys end employee phishing at Google",when:"July 2018",year:2018,kind:"research",summary:"Google reported that after requiring hardware security keys for all of its 85,000+ employees in early 2017, it had no confirmed account takeovers from phishing.",lesson:"Origin-bound credentials remove the human from the \u201Cis this the real site?\u201D decision.",specs:["webauthn"]},{id:"c-tokenbinding-2018",title:"Token Binding is dropped from Chrome",when:"2018",year:2018,kind:"platform",summary:"Token Binding bound tokens and cookies to keys at the TLS layer. Its RFCs were published in October 2018, the same year Chrome removed its implementation, leaving no browser to bind tokens to.",lesson:"Binding at the application layer (DPoP) doesn\u2019t depend on browsers and TLS terminators cooperating.",specs:["rfc9449"]},{id:"c-openbanking-2018",title:"UK Open Banking launches",when:"January 2018",year:2018,kind:"regulation",summary:"Following a 2016 competition ruling, the UK\u2019s largest banks had to open account and payment APIs to licensed third parties. Their security profile was built on the OpenID Foundation\u2019s Financial-grade API work.",lesson:"Regulation turned OAuth\u2019s optional security features into requirements.",specs:["fapi1","rfc8705","fapi2-sp"]},{id:"c-fapianalysis-2019",title:"Formal analysis of the Financial-grade API",when:"2019",year:2019,kind:"research",summary:"Fett, Hosseyni and K\xFCsters (IEEE S&P 2019) analysed FAPI 1.0 formally and found several attacks despite its strict rules, then proposed fixes. The experience shaped FAPI 2.0, which starts from an explicit attacker model.",lesson:"A list of rules isn\u2019t a security argument. State the attacker, then prove the profile against it.",specs:["fapi2-sp","fapi1"]},{id:"c-psd2-2019",title:"PSD2 strong customer authentication and dynamic linking",when:"September 2019",year:2019,kind:"regulation",summary:"The EU\u2019s regulatory technical standards for strong customer authentication took effect, requiring that the authentication for a payment be dynamically linked to its exact amount and payee.",lesson:"Scopes can\u2019t express \u201Cthis payment\u201D. Rich Authorization Requests can.",specs:["rfc9396","grant-management"]},{id:"c-samesite-2020",title:"Chrome defaults cookies to SameSite=Lax",when:"February 2020",year:2020,kind:"platform",summary:"Chrome began treating cookies without a SameSite attribute as Lax. Sign-ins using `form_post` arrive as cross-site POSTs, so cookies used to match state and nonce stopped being sent and many logins broke until apps marked those cookies `SameSite=None; Secure`.",lesson:"Browser privacy changes reshape how front-channel protocols work.",specs:["oidc-formpost"]},{id:"c-itp-2020",title:"Safari blocks all third-party cookies",when:"March 2020",year:2020,kind:"platform",summary:"Safari\u2019s Intelligent Tracking Prevention began blocking third-party cookies outright. Hidden-iframe tricks that identity providers relied on (silent token renewal, session checks, front-channel logout) stopped working in Safari.",lesson:"Anything that depends on third-party cookies in iframes will fail somewhere; back-channel and server-side designs survive.",specs:["oidc-backchannel","oidc-session","oidc-frontchannel","rfc10017"]},{id:"c-apple-2020",title:"Sign in with Apple token flaw",when:"May 2020",year:2020,kind:"research",summary:"Bhavuk Jain found that Apple\u2019s servers would issue a validly signed ID token for any email address the requester supplied, letting him sign in to third-party apps as other people. Apple paid a $100,000 bounty.",lesson:"The signature proves the issuer said it, so the issuer must only say true things. Relying parties trust exactly that.",specs:["oidc-core"]},{id:"c-goldensaml-2020",title:"Golden SAML in the SolarWinds intrusion",when:"December 2020",year:2020,kind:"incident",summary:"In the SolarWinds campaign, attackers stole token-signing certificates from on-premises federation servers and forged SAML assertions for any user, reaching cloud email and apps. The technique had been described in 2017 as \u201CGolden SAML\u201D.",lesson:"Whoever holds the signing key is every user. Protect, rotate and monitor issuer keys like the crown jewels.",specs:["saml2","openid-federation"]},{id:"c-ssrf-2021",title:"Hidden OAuth attack vectors",when:"2021",year:2021,kind:"research",summary:"PortSwigger research by Michael Stepankin showed that OpenID dynamic registration fields like `logo_uri`, `jwks_uri`, `sector_identifier_uri` and `request_uris` make providers fetch attacker-chosen URLs, enabling server-side request forgery, and found real instances in deployed providers.",lesson:"Every URL in client metadata is a request your server will make on someone else\u2019s behalf.",specs:["oidc-registration","rfc7591","rfc9101","cimd"]},{id:"c-codecov-2021",title:"Codecov Bash Uploader compromise",when:"January\u2013April 2021",year:2021,kind:"incident",summary:"Attackers modified Codecov\u2019s widely used Bash Uploader script so that it sent every CI environment variable, including cloud keys and tokens, to their server. It went unnoticed for about two months.",lesson:"Long-lived secrets in CI environments are one script away from exfiltration. Short-lived, platform-issued workload identity removes them.",specs:["spiffe","spiffe-workload-api","wimse-practices"]},{id:"c-uber-2016",title:"Uber\u2019s keys in a code repository",when:"2016",year:2016,kind:"incident",summary:"Attackers got into a private code repository used by Uber engineers, found cloud credentials there, and downloaded data on 57 million riders and drivers. Uber paid the attackers and concealed the breach for a year.",lesson:"Static service credentials end up in places they shouldn\u2019t. A credential that expires in an hour is worth far less when it leaks.",specs:["spiffe"]},{id:"c-psychic-2022",title:"Psychic signatures in Java",when:"April 2022",year:2022,kind:"research",summary:"Neil Madden found that Java 15 to 18 accepted ECDSA signatures with r = s = 0 as valid for any message and key (CVE-2022-21449), so any ES256 JWT could be forged.",lesson:"Validate signature inputs, and test verifiers with known-bad signatures.",specs:["rfc8725"]},{id:"c-heroku-2022",title:"Stolen OAuth tokens from Heroku and Travis CI",when:"April 2022",year:2022,kind:"incident",summary:"Attackers used stolen OAuth user tokens that GitHub had issued to the Heroku and Travis CI integrations to download private repositories from dozens of organizations, including npm.",lesson:"Integration tokens are long-lived bearer credentials sitting in someone else\u2019s database.",specs:["rfc9449","id-jag"]},{id:"c-0ktapus-2022",title:"0ktapus phishing campaign",when:"Summer 2022",year:2022,kind:"incident",summary:"Text messages led employees of more than 130 organizations to fake sign-in pages that relayed passwords and one-time codes in real time. Cloudflare was targeted too but stopped it because employees used FIDO2 security keys.",lesson:"One-time codes are phishable. Origin-bound keys aren\u2019t.",specs:["webauthn"]},{id:"c-uber-2022",title:"Uber MFA fatigue",when:"September 2022",year:2022,kind:"incident",summary:"An attacker with a contractor\u2019s password sent repeated push approval requests, then messaged the contractor pretending to be IT support until they approved one.",lesson:"Decoupled approvals need context (binding messages, number matching) and limits, or users approve requests they didn\u2019t start.",specs:["ciba"]},{id:"c-circleci-2023",title:"CircleCI session cookie theft",when:"January 2023",year:2023,kind:"incident",summary:"Malware on an engineer\u2019s laptop stole a valid SSO session cookie backed by two-factor authentication. The attacker used it to reach production systems and customer secrets, and CircleCI told every customer to rotate all secrets.",lesson:"Strong login doesn\u2019t protect the session that follows. Sessions need binding and continuous evaluation.",specs:["ssf","caep"]},{id:"c-noauth-2023",title:"nOAuth",when:"June 2023",year:2023,kind:"research",summary:"Descope showed that apps using Microsoft Entra ID sign-in, which identified users by the mutable and unverified `email` claim, could be taken over by an attacker who set a victim\u2019s email on an account in their own tenant.",lesson:"Identify users by `iss` + `sub`, never by email.",specs:["oidc-core","rfc9068"]},{id:"c-storm0558-2023",title:"Storm-0558",when:"July 2023",year:2023,kind:"incident",summary:"An attacker obtained a Microsoft consumer-account signing key and forged tokens that Exchange Online accepted for enterprise mailboxes, reaching email at about 25 organizations, including US government agencies.",lesson:"Check that the issuer, the key and the audience are the ones this service should accept, not just that the signature verifies.",specs:["rfc8707","rfc9068"]},{id:"c-okta-2023",title:"Okta support system breach",when:"October 2023",year:2023,kind:"incident",summary:"Attackers accessed Okta\u2019s support case system, where customers had uploaded browser HAR files for troubleshooting. Those files contained live session tokens, which were used to hijack admin sessions at several customers.",lesson:"Sessions and tokens leak through logs and debug files. Revocation must reach every app quickly.",specs:["ssf","caep","rfc9470"]},{id:"c-midnight-2024",title:"Midnight Blizzard and the test-tenant OAuth app",when:"January 2024",year:2024,kind:"incident",summary:"Attackers password-sprayed a legacy test account without MFA, then compromised an old test OAuth application that had elevated access into Microsoft\u2019s corporate environment. They created new apps and granted them full mailbox access, reading email of senior leadership and security staff.",lesson:"Application identities with broad, standing permissions are a bigger target than any user. Scope access per transaction and review app grants.",specs:["rfc8693","txn-tokens"]},{id:"c-polyfill-2024",title:"polyfill.io supply-chain compromise",when:"June 2024",year:2024,kind:"incident",summary:"After the polyfill.io domain changed hands, the script it served was modified to inject malicious code into more than 100,000 websites that loaded it.",lesson:"Any script on your origin runs as your app, including with access to whatever tokens your pages hold.",specs:["rfc10017"]},{id:"c-storm2372-2025",title:"Storm-2372 device code phishing",when:"August 2024 \u2013 2025",year:2025,kind:"incident",summary:"Posing as contacts on messaging apps, the actor sent fake meeting invitations whose \u201Cmeeting ID\u201D was a device code. Victims entered it on Microsoft\u2019s real sign-in page, handing the attacker access and refresh tokens. From February 2025 the actor also registered devices to obtain primary refresh tokens. Microsoft advised blocking device code flow where possible.",lesson:"The device flow trusts that the person approving is in front of the device. Restrict it to where that\u2019s true.",specs:["rfc8628"]},{id:"c-tjactions-2025",title:"tj-actions/changed-files compromise",when:"March 2025",year:2025,kind:"incident",summary:"A popular GitHub Action was modified to dump CI runner secrets into build logs, which were public for many open-source repositories (CVE-2025-30066).",lesson:"Secrets stored in CI are exposed to every dependency of the pipeline. Federated, short-lived workload tokens shrink what leaks.",specs:["wimse-practices","wimse-arch"]},{id:"c-githubmcp-2025",title:"GitHub MCP prompt injection",when:"May 2025",year:2025,kind:"research",summary:"Invariant Labs showed that a malicious issue in a public repository could instruct an AI agent using the GitHub MCP server to read the user\u2019s private repositories and publish their contents in a public pull request. The agent used a personal access token with access to everything.",lesson:"An agent\u2019s token should grant the task, not the user\u2019s whole account. Least privilege per task is the only defense that survives prompt injection.",specs:["mcp-auth","aiagent-auth","txn-tokens"]},{id:"c-asana-2025",title:"Asana MCP server data exposure",when:"June 2025",year:2025,kind:"incident",summary:"About a month after launching an experimental MCP server, Asana found a flaw that could expose information from one customer\u2019s domain to other MCP users. It took the server offline from June 5 to 17 and reset all connections.",lesson:"An MCP server is a resource server: every request must be authorized against the right tenant and audience.",specs:["mcp-auth","rfc8707"]},{id:"c-mcpremote-2025",title:"CVE-2025-6514 in mcp-remote",when:"July 2025",year:2025,kind:"research",summary:"JFrog found that mcp-remote, a widely used client proxy, passed the `authorization_endpoint` from a server\u2019s OAuth metadata to the operating system to open a browser. A malicious server could return a crafted value that ran commands on the user\u2019s machine (CVSS 9.6, fixed in 0.1.16).",lesson:"OAuth metadata from a server you just met is untrusted input. Validate URLs before acting on them.",specs:["mcp-auth","rfc8414"]},{id:"c-drift-2025",title:"Salesloft Drift OAuth token theft",when:"August 2025",year:2025,kind:"incident",summary:"Between August 8 and 18, an actor tracked as UNC6395 used OAuth access and refresh tokens stolen from Salesloft\u2019s Drift integration to query hundreds of customers\u2019 Salesforce instances, hunting for AWS keys, passwords and other secrets in support cases. All Drift tokens were revoked.",lesson:"Third-party integration tokens are standing access granted outside your identity provider\u2019s view.",specs:["id-jag","aiagent-auth","ssf"]}];var we=[{id:"delegation",title:"Stop sharing passwords",track:"oauth",steps:[{y:2007,c:"c-password-2007",note:"Apps log in with your password. OAuth 1.0 gives them a token instead."},{y:2009,c:"c-fixation-2009",note:"Session fixation shows a response must be bound to whoever started the flow."},{y:2012,s:"rfc6749",note:"OAuth 2.0 trades signatures for bearer tokens over TLS and becomes a framework of options."},{y:2012,c:"c-roadtohell-2012",note:"Its editor warns that optional security will be skipped."},{y:2013,s:"rfc6819",note:"A threat model catalogs what can go wrong."},{y:2025,s:"rfc9700",note:"Twelve years of attacks become required practice."},{y:2026,s:"oauth21",note:"One document with safe defaults, still in draft."}]},{id:"login",title:"Access tokens were never proof of login",track:"oidc",steps:[{y:2014,c:"c-mobile-2014",note:"Apps accept tokens issued to other apps as login."},{y:2014,s:"oidc-core",note:"The ID token: addressed to one client, bound by nonce."},{y:2020,c:"c-apple-2020",note:"An issuer that signs anything makes every check pointless."},{y:2021,s:"rfc9068",note:"Access tokens get their own type, so ID tokens can\u2019t pass as them."},{y:2023,c:"c-noauth-2023",note:"Identifying users by email instead of iss + sub leads to takeover."}]},{id:"frontchannel",title:"Codes in hostile territory",track:"oauth",steps:[{y:2014,c:"c-covert-2014",note:"Loose redirect checks leak codes and tokens."},{y:2015,s:"rfc7636",note:"PKCE: a stolen code is useless without the verifier."},{y:2016,c:"c-embedded-2016",note:"Embedded web views are banned from sign-in."},{y:2017,s:"rfc8252",note:"Native apps must use the system browser and PKCE."},{y:2016,c:"c-fett-2016",note:"Formal analysis finds mix-up attacks."},{y:2022,s:"rfc9207",note:"Authorization responses name their issuer."},{y:2025,s:"rfc9700",note:"Implicit flow is gone; exact matching and PKCE are required."}]},{id:"bearer",title:"Bearer means whoever holds it",track:"fapi",steps:[{y:2012,s:"rfc6750",note:"Bearer tokens: simple, and fully usable by a thief."},{y:2018,c:"c-tokenbinding-2018",note:"TLS-layer Token Binding dies in browsers."},{y:2020,s:"rfc8705",note:"Certificate-bound tokens for servers."},{y:2022,c:"c-heroku-2022",note:"Stolen integration tokens give months of access."},{y:2023,s:"rfc9449",note:"DPoP binds tokens to a key any client can hold."},{y:2025,s:"fapi2-sp",note:"Sender-constrained tokens become mandatory for finance."}]},{id:"request",title:"Protect the request itself",track:"fapi",steps:[{y:2014,s:"oidc-mrt",note:"Parameters and responses travel in URLs."},{y:2021,s:"rfc9101",note:"Sign the request so nobody can alter it."},{y:2021,s:"rfc9126",note:"Push it over the back channel so it never touches the browser."},{y:2022,s:"jarm",note:"Sign the response too."},{y:2025,s:"fapi2-sp",note:"PAR becomes the default for high-security profiles."}]},{id:"coarse",title:"Scopes are too coarse",track:"fapi",steps:[{y:2012,s:"rfc6749",note:"Scope is a space-separated list of strings."},{y:2019,c:"c-psd2-2019",note:"Regulation demands consent to an exact amount and payee."},{y:2023,s:"rfc9396",note:"authorization_details carries structured, typed requests."},{y:2021,s:"grant-management",note:"Long-lived consents become objects you can query and revoke."}]},{id:"discovery",title:"Which server am I talking to?",track:"oidc",steps:[{y:2014,s:"oidc-discovery",note:"Providers publish their own metadata."},{y:2018,s:"rfc8414",note:"Plain OAuth gets the same."},{y:2016,c:"c-fett-2016",note:"Clients with several servers can be mixed up."},{y:2022,s:"rfc9207",note:"Responses carry iss."},{y:2025,s:"rfc9728",note:"APIs publish which authorization servers protect them."},{y:2025,c:"c-mcpremote-2025",note:"Metadata from a new server is attacker-controlled input."},{y:2026,s:"mcp-auth",note:"MCP requires resource metadata and issuer checks."}]},{id:"registration",title:"Who is this client?",track:"oidc",steps:[{y:201
